name: ComicCrafte Pro Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # =========================
      # RÉCUPÉRATION DU CODE
      # =========================
      - name: Checkout Source
        uses: actions/checkout@v4

      # =========================
      # CONFIGURATION NODE.JS (AVEC CACHE)
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # =========================
      # CONFIGURATION JAVA JDK 21 (INDISPENSABLE)
      # =========================
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21' # Règle l'erreur 'invalid source release: 21'
          cache: gradle

      # =========================
      # INSTALLATION PROPRE
      # =========================
      - name: Install Dependencies
        run: npm ci

      # =========================
      # COMPILATION DU PROJET WEB
      # =========================
      - name: Build Web Project
        run: npm run build

      # =========================
      # SYNCHRONISATION CAPACITOR
      # =========================
      - name: Sync Capacitor
        run: npx cap sync android

      # =========================
      # PERMISSIONS GRADLE
      # =========================
      - name: Grant Gradle Permission
        run: chmod +x android/gradlew

      # =========================
      # GÉNÉRATION DE L'APK DEBUG
      # =========================
      - name: Build Android APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      # =========================
      # VÉRIFICATION DU FICHIER
      # =========================
      - name: Verify APK
        run: ls -la android/app/build/outputs/apk/debug/

      # =========================
      # ENVOI DE L'APK SUR GITHUB
      # =========================
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ComicCrafte-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
