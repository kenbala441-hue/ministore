<!DOCTYPE html>
<html lang="fr">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <meta
    http-equiv="X-UA-Compatible"
    content="IE=edge"
  />

  <meta
    name="theme-color"
    content="#050505"
  />

  <meta
    name="color-scheme"
    content="dark"
  />

  <title>ComicCraft</title>

  <style>

    html,
    body,
    #root {

      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: #050505;
      color: white;

      overflow-x: hidden;
    }

    body {
      font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;
    }

  </style>

</head>

<body>

  <div id="root"></div>

  <script>

    // =========================================================
    // GLOBAL ERROR CAPTURE
    // =========================================================

    window.__COMICCRAFT_ERRORS__ = [];

    function saveError(type, payload) {

      try {

        window.__COMICCRAFT_ERRORS__.push({

          type,

          timestamp:
            new Date().toISOString(),

          ...payload,

        });

        if (
          window.__COMICCRAFT_ERRORS__.length >
          100
        ) {

          window.__COMICCRAFT_ERRORS__.shift();
        }

      } catch {}
    }

    // =========================================================
    // JS ERRORS
    // =========================================================

    window.addEventListener(
      "error",
      function (event) {

        saveError("window.error", {

          message:
            event.message,

          source:
            event.filename,

          line:
            event.lineno,

          column:
            event.colno,

          stack:
            event.error?.stack,

        });

      },
      true
    );

    // =========================================================
    // PROMISE ERRORS
    // =========================================================

    window.addEventListener(
      "unhandledrejection",
      function (event) {

        saveError(
          "promise.error",
          {

            reason:
              event.reason
                ?.message ||
              String(
                event.reason
              ),

            stack:
              event.reason
                ?.stack,

          }
        );

      }
    );

    // =========================================================
    // RESOURCE ERRORS
    // =========================================================

    window.addEventListener(
      "error",
      function (event) {

        const target =
          event.target;

        if (
          target &&
          target !== window
        ) {

          saveError(
            "resource.error",
            {

              tag:
                target.tagName,

              src:
                target.src,

              href:
                target.href,

            }
          );
        }

      },
      true
    );

    // =========================================================
    // REACT STRICT MODE DEBUG
    // =========================================================

    window.__DEBUG_MODE__ = true;

    // =========================================================
    // ERUDA DEVTOOLS
    // =========================================================

    if (

      location.hostname ===
        "localhost"

      ||

      location.hostname ===
        "127.0.0.1"

      ||

      location.hostname.startsWith(
        "192.168."
      )

      ||

      location.hostname.startsWith(
        "10."
      )

    ) {

      const script =
        document.createElement(
          "script"
        );

      script.src =
        "https://cdn.jsdelivr.net/npm/eruda";

      script.onload =
        function () {

          eruda.init();

          console.log(
            "🚀 Eruda Loaded"
          );

          console.log(
            "Captured Errors:",
            window.__COMICCRAFT_ERRORS__
          );
        };

      document.body.appendChild(
        script
      );
    }

  </script>

  <script
    type="module"
    src="/src/main.jsx"
    crossorigin="anonymous"
  ></script>

</body>

</html>
